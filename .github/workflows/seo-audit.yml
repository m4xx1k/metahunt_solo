name: seo

# The audit needs a running app AND a reachable API, and the ci.yml jobs have
# neither — so it runs against the Vercel deployment once that finishes, rather
# than trying to boot web plus a database inside the runner.
on:
  deployment_status:

jobs:
  contract:
    name: contract (seo)
    # Railway posts deployment_status too (environment "metahunt / production",
    # creator railway-app[bot]). Without this the audit crawls the Railway
    # dashboard URL and reports 32 "failures" that are just railway.com not
    # being our marketing site. The env-name guard below cannot catch it: it is
    # an AND with the bypass-secret check, so configuring that secret (done
    # 2026-07-27) disabled the skip for every non-Vercel deploy.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Preview deployments sit behind Vercel's deployment protection, so an
      # unauthenticated crawl gets a 302 to the SSO login on every route — which
      # reads as "every SEO invariant is broken" rather than "I could not get in".
      # Production is public. To gate previews too, add the project's protection
      # bypass secret as VERCEL_AUTOMATION_BYPASS_SECRET; the audit sends it as
      # x-vercel-protection-bypass and nothing else needs to change.
      - name: Audit the deployment
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOY_ENV: ${{ github.event.deployment_status.environment }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "No environment_url on this deployment event — nothing to audit."
            exit 0
          fi
          if [ "$DEPLOY_ENV" != "Production" ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "Skipping: '$DEPLOY_ENV' is protected and no bypass secret is configured."
            echo "Set VERCEL_AUTOMATION_BYPASS_SECRET to audit previews as well."
            exit 0
          fi
          pnpm seo:audit "$DEPLOY_URL"
