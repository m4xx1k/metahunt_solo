global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "metahunt-etl"
    scrape_interval: 15s
    bearer_token_file: /etc/prometheus/bearer.token
    static_configs:
      # Railway internal DNS for the @metahunt/etl service (listens on PORT 3000 in production Dockerfile)
      - targets: ["etl.railway.internal:3000"]
