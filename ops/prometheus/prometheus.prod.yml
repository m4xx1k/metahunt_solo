global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "metahunt-etl"
    scrape_interval: 15s
    scheme: https
    bearer_token_file: /etc/prometheus/bearer.token
    static_configs:
      # Public production endpoint on Railway (with SSL termination and port 8080 routing)
      - targets: ["api.metahunt.app"]
