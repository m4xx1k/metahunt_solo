# ATS PoC stack — MET-54. Throwaway: deleted when the verdict memo lands.
#
#   docker compose -f compose.poc.yaml up -d
#   docker compose -f compose.poc.yaml down -v     # -v also drops the data
#
# Deliberately ONE container. No MinIO (raw board payloads go to
# .poc-artifacts/ on disk), no Temporal (the PoC driver is a CLI). The host
# already runs 7 containers and sits on a nearly-full swap, so every service
# here has to earn its place.
#
# ISOLATION: this file must never reference `metahunt_railway_pgdata` — that
# external volume holds the prod restore the rest of the dev stack runs on.
# Port 54399 keeps a fat-fingered psql away from the 54323 dev DB.

services:
  ats-poc-db:
    container_name: ats-poc-db
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ats_poc
      POSTGRES_USER: metahunt
      POSTGRES_PASSWORD: ${POC_POSTGRES_PASSWORD:-atspoc}
    ports:
      - "54399:5432"
    # pg18 moved the data dir under a version subdir and declares the volume at
    # /var/lib/postgresql — mounting .../data instead makes the image refuse to
    # start. Same shape as compose.infra.yaml.
    volumes:
      - ats_poc_pgdata:/var/lib/postgresql
    # Restoring a 219MB prod dump wants more than the 64MB default /dev/shm,
    # and the caps keep this off the host's already-swapping memory.
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metahunt -d ats_poc"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ats_poc_pgdata:
    name: ats_poc_pgdata
